services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    environment:
      - BASE44_PREVIEW_MODE=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const req = http.get('http://localhost:3000/', r => { process.exit(r.statusCode === 200 ? 0 : 1) }); req.on('error', () => process.exit(1)); req.setTimeout(3000, () => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: on-failure

volumes:
  node_modules:
